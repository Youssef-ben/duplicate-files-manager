name: Cleanup deps branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  delete:
    name: Delete chore/deps
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'chore/deps'
    runs-on: ubuntu-latest
    steps:
      - name: Close leftover PRs and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for num in $(gh pr list --base chore/deps --state open --json number --jq '.[].number'); do
            echo "Closing leftover PR #$num"
            gh pr close "$num" --comment "Closed: chore/deps was merged and deleted." || true
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/chore/deps" \
            || echo "Branch already deleted"
