name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      should_release: ${{ steps.ci.outputs.should_release || steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version and gate release
        run: |
          SHA="${{ github.sha }}"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Skip when package.json changed but version did not (push only).
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse "${SHA}^" >/dev/null 2>&1; then
            PREV=$(git show "${SHA}^:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ "$PREV" = "$VERSION" ]; then
              echo "Version unchanged ($VERSION) — skip"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG already exists — skip"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG at $SHA"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI
        id: ci
        if: steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          echo "Waiting for CI on $SHA ($BRANCH)..."
          for i in $(seq 1 60); do
            RUN=$(gh run list \
              --workflow CI \
              --commit "$SHA" \
              --branch "$BRANCH" \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')

            if [ -z "$RUN" ]; then
              echo "CI status: none"
              sleep 15
              continue
            fi

            STATUS=$(printf '%s' "$RUN" | jq -r .status)
            CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion // ""')
            RUN_ID=$(printf '%s' "$RUN" | jq -r .databaseId)
            echo "CI status: ${STATUS}:${CONCLUSION} (run $RUN_ID)"

            if [ "$STATUS" != "completed" ]; then
              if gh run watch "$RUN_ID" --exit-status; then
                echo "CI passed"
                echo "should_release=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)
              STATUS=completed
            fi

            case "${STATUS}:${CONCLUSION}" in
              completed:success)
                echo "CI passed"
                echo "should_release=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              completed:cancelled)
                TIP=$(gh api "repos/${{ github.repository }}/commits/${BRANCH}" --jq .sha)
                if [ "$TIP" != "$SHA" ]; then
                  echo "CI cancelled and ${BRANCH} moved on ($TIP) — skip release"
                  echo "should_release=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "CI cancelled — waiting for a re-run on this SHA"
                sleep 15
                ;;
              completed:*)
                echo "CI finished without success (${STATUS}:${CONCLUSION}) — abort release"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          echo "Timed out waiting for CI"
          exit 1

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builder_args: --win nsis
            artifacts: |
              dist/*.exe
              dist/*.yml
              dist/*.blockmap
          - name: Linux
            os: ubuntu-latest
            builder_args: --linux AppImage
            artifacts: |
              dist/*.AppImage
              dist/*.yml
              dist/*.blockmap
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          yarn electron-vite build
          yarn electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # softprops creates the tag at target_commitish — avoids orphan tags if upload fails.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
