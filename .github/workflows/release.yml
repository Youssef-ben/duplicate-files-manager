name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builder_args: --win nsis
            artifacts: |
              dist/*.exe
          - name: Linux
            os: ubuntu-latest
            builder_args: --linux AppImage
            artifacts: |
              dist/*.AppImage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Full install: postinstall fetches the CLI into resources/ for packaging.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and package
        env:
          # Unsigned builds until code-signing certs are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          yarn electron-vite build
          yarn electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifacts }}
          generate_release_notes: true
          fail_on_unmatched_files: false
