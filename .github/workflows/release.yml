name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version and gate release
        run: |
          SHA="${{ github.sha }}"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Skip when package.json changed but version did not (push only).
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse "${SHA}^" >/dev/null 2>&1; then
            PREV=$(git show "${SHA}^:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if [ "$PREV" = "$VERSION" ]; then
              echo "Version unchanged ($VERSION) — skip"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG already exists — skip"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release $TAG at $SHA"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI
        if: steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI on ${{ github.sha }}..."
          for i in $(seq 1 60); do
            CONCLUSION=$(gh run list \
              --workflow CI \
              --commit "${{ github.sha }}" \
              --branch main \
              --limit 1 \
              --json conclusion,status \
              --jq '.[0] | "\(.status):\(.conclusion // "")"')

            echo "CI status: ${CONCLUSION:-none}"

            case "$CONCLUSION" in
              completed:success)
                echo "CI passed"
                exit 0
                ;;
              completed:*)
                echo "CI finished without success ($CONCLUSION) — abort release"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

          echo "Timed out waiting for CI"
          exit 1

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builder_args: --win nsis
            artifacts: dist/*.exe
          - name: Linux
            os: ubuntu-latest
            builder_args: --linux AppImage
            artifacts: dist/*.AppImage
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          yarn electron-vite build
          yarn electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Tag & Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create and push tag
        run: |
          git tag "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.sha }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
