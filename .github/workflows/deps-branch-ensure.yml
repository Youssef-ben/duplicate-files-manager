name: Ensure deps branch

on:
  schedule:
    # Saturday 00:00 UTC — before Sunday Dependabot.
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  ensure:
    name: Create or reset chore/deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create or reset chore/deps from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-remote --heads origin chore/deps | grep -q .; then
            OPEN_TO_MAIN=$(gh pr list --base main --head chore/deps --state open --json number --jq 'length')
            if [ "$OPEN_TO_MAIN" != "0" ]; then
              echo "Open chore/deps → main PR exists — leaving branch unchanged"
              exit 0
            fi

            # Close Dependabot PRs whose CI already failed so they cannot block reset forever.
            bash .github/scripts/close-stuck-dependabot-prs.sh chore/deps \
              "Closed: CI failed; clearing chore/deps for weekly reset." \
              "Merge when CI passes"

            OPEN_INTO_DEPS=$(gh pr list --base chore/deps --state open --json number --jq 'length')
            if [ "$OPEN_INTO_DEPS" != "0" ]; then
              echo "Open PRs target chore/deps — leaving branch unchanged"
              exit 0
            fi

            git fetch origin chore/deps
            # Re-check immediately before reset to reduce race with new Dependabot PRs.
            OPEN_INTO_DEPS=$(gh pr list --base chore/deps --state open --json number --jq 'length')
            if [ "$OPEN_INTO_DEPS" != "0" ]; then
              echo "Open PRs appeared — leaving branch unchanged"
              exit 0
            fi

            echo "Resetting chore/deps to origin/main"
            git checkout -B chore/deps origin/main
            if ! git push --force-with-lease=chore/deps:origin/chore/deps origin chore/deps; then
              echo "Remote chore/deps moved — aborting reset"
              exit 0
            fi
          else
            echo "Creating chore/deps from origin/main"
            git checkout -B chore/deps origin/main
            git push origin chore/deps
          fi
