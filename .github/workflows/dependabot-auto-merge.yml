name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Merge when CI passes
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Version updates (incl. majors) into chore/deps; security updates into main
      # (Dependabot ignores target-branch for alerts).
      # Wait only for CI job names — do not use `gh pr checks --watch`
      # (it waits on this job and deadlocks). Optional: ruleset requiring CI on
      # chore/deps and main; allow Actions to force-push/delete chore/deps.
      - name: Wait for CI and squash-merge
        if: |
          github.event.pull_request.base.ref == 'chore/deps' ||
          (
            github.event.pull_request.base.ref == 'main' &&
            steps.meta.outputs.alert-number != ''
          )
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must match job `name:` values in ci.yml
          REQUIRED_CHECKS: '["Lint & Typecheck","Build"]'
        run: |
          set -euo pipefail
          echo "Waiting for CI checks on $PR_URL: $REQUIRED_CHECKS"
          for i in $(seq 1 60); do
            # gh exits 8 while checks are pending; still emit JSON.
            # Use standalone jq — gh --jq does not support --arg/--argjson.
            CHECKS=$(gh pr checks "$PR_URL" --json name,bucket || true)
            if [ -z "$CHECKS" ]; then
              STATE=pending
            else
              STATE=$(printf '%s' "$CHECKS" | jq -r --argjson required "$REQUIRED_CHECKS" '
                map(select(.name as $n | $required | index($n))) as $found
                | if ($found | length) != ($required | length) then "pending"
                  elif any($found[]; .bucket == "fail" or .bucket == "cancel") then "fail"
                  elif any($found[]; .bucket == "pending") then "pending"
                  elif all($found[]; .bucket == "pass" or .bucket == "skipping") then "pass"
                  else "pending"
                  end
              ' || echo pending)
            fi

            echo "Check state: ${STATE:-pending}"

            case "${STATE:-pending}" in
              pass)
                echo "CI passed — merging"
                gh pr merge --squash "$PR_URL"
                exit 0
                ;;
              fail)
                echo "CI did not pass ($STATE) — abort"
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done

          echo "Timed out waiting for CI"
          exit 1
