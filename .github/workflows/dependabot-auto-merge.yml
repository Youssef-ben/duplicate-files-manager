name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Version updates: patch/minor (and grouped non-majors) into chore/deps.
      # Security updates: patch/minor into main (Dependabot ignores target-branch).
      # Majors stay manual.
      - name: Merge patch and minor
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          (
            github.event.pull_request.base.ref == 'chore/deps' ||
            (
              github.event.pull_request.base.ref == 'main' &&
              steps.meta.outputs.alert-number != ''
            )
          )
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Checks may not be registered yet when the PR event fires.
          for i in $(seq 1 20); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 15
          done
          gh pr checks "$PR_URL" --watch
          gh pr merge --squash "$PR_URL"
